[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy_follow_me"
version = "0.2.0"
description = "Local webcam head and hand teleoperation for Reachy Mini Control"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["reachy-mini>=1.11,<1.12", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "platformdirs>=4,<5"]
keywords = ["reachy-mini-app", "teleoperation", "education"]

[project.entry-points."reachy_mini_apps"]
reachy_follow_me = "reachy_follow_me.main:ReachyFollowMe"

[tool.setuptools.packages.find]
include = ["reachy_follow_me*"]

[tool.setuptools.package-data]
reachy_follow_me = ["web/*", "assets-manifest.json"]
