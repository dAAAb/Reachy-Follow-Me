<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reachy Follow Me</title><style>body{background:#08121d;color:#eff6ff;font:20px system-ui;max-width:900px;margin:8vh auto;padding:24px}h1{font-size:56px}a{color:#8de4c0}p{line-height:1.7}</style><h1>Reachy Follow Me</h1><p>你的轉頭、舉手，成為另一個身體的動作。</p><p>這是安裝到 Reachy Mini Control / daemon 的 Python App。影像在操作者的瀏覽器辨識；只有有界角度送給本機 SDK。</p><p>在 Control 的社群 App 清單搜尋 <strong>Reachy Follow Me</strong>，安裝後按 Run，再開啟設定頁。第一版優先支援電腦本機 daemon；Wireless 的 localhost 轉接方式見 README。</p><p><a href="https://github.com/dAAAb/Reachy-Follow-Me">原始碼、安裝、模擬器與測試紀錄</a></p><p>本頁是 App 介紹，沒有攝影機、控制權或雲端推論。</p></html>
